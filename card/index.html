<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Digital Business Card</title>
  <link rel="icon" type="image/png" href="/favicon.png">
  <style>
    :root {
      --navy-deep: #0d1b3e;
      --navy: #15295c;
      --navy-light: #1f3f86;
      --accent: #2f6fed;
      --ink: #1f2937;
      --muted-ink: #6b7280;
      --text-on-dark: #eef2ff;
      --muted-on-dark: rgba(238, 242, 255, 0.68);
      --white: #ffffff;
      --radius-pill: 999px;
    }
    * { box-sizing: border-box; }
    html { min-height: 100%; background: #0d1b3e; }
    body {
      min-height: 100%; margin: 0;
      display: flex; justify-content: center;
      padding: 30px 16px;
      color: var(--text-on-dark);
      background: linear-gradient(160deg, #14275a 0%, #0d1c3e 100%);
      font-family: "Courier New", Courier, monospace;
      line-height: 1.35;
    }
    a { color: inherit; text-decoration: none; }
    button { font: inherit; }

    .page-shell {
      position: relative;
      width: min(100%, 430px);
      align-self: flex-start;
      background: linear-gradient(165deg, #1d3f82 0%, #16306b 55%, #0e1f47 100%);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 30px;
      box-shadow: 0 30px 60px rgba(7, 14, 32, 0.45);
      overflow: hidden;
    }
    .card-content { padding: 26px 18px 22px; }

    .profile { text-align: center; }
    .avatar-wrap {
      position: relative; width: 92px; height: 92px;
      margin: 0 auto 14px;
    }
    .avatar-wrap::before {
      content: ""; position: absolute; inset: -8px; border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, rgba(255,255,255,.35), rgba(255,255,255,0) 70%);
    }
    .avatar {
      position: relative; width: 92px; height: 92px;
      display: block; border-radius: 50%; object-fit: cover;
      border: 3px solid rgba(255,255,255,0.92);
      box-shadow: 0 10px 24px rgba(0,0,0,0.35);
    }
    .profile h1 {
      margin: 0 0 3px; font-size: 20px; font-weight: 700;
      letter-spacing: 0.01em; color: #fff;
    }
    .profile p {
      margin: 0; color: var(--muted-on-dark);
      font-size: 12px; letter-spacing: 0.01em;
    }

    .quick-actions {
      display: flex; justify-content: center;
      gap: 14px; margin: 18px 0 4px;
    }
    .quick-actions a {
      display: flex; align-items: center; justify-content: center;
      width: 46px; height: 46px; border-radius: 50%;
      background: rgba(255,255,255,0.96);
      color: var(--accent);
      box-shadow: 0 8px 16px rgba(0,0,0,0.25);
      transition: transform 160ms ease;
    }
    .quick-actions a:hover { transform: translateY(-2px); }
    .quick-actions svg {
      width: 20px; height: 20px; fill: none; stroke: currentColor;
      stroke-width: 2; stroke-linecap: round; stroke-linejoin: round;
    }

    .tabs {
      display: flex; align-items: center;
      width: fit-content; height: 38px;
      margin: 20px auto 18px; padding: 3px;
      border: 1px solid rgba(255,255,255,0.18);
      border-radius: var(--radius-pill);
      background: rgba(255,255,255,0.08);
    }
    .tab {
      display: flex; align-items: center; justify-content: center;
      height: 100%; padding: 0 16px; border: 0;
      border-radius: var(--radius-pill);
      color: rgba(255,255,255,0.7); background: transparent;
      cursor: pointer; white-space: nowrap;
      font-family: system-ui, sans-serif; font-size: 12px; font-weight: 700;
    }
    .tab.active {
      color: var(--navy-deep); background: #fff;
      box-shadow: 0 4px 10px rgba(0,0,0,0.18);
    }
    .tab-panel { display: none; }
    .tab-panel.active { display: block; }

    .link-stack { display: grid; gap: 10px; margin-top: 6px; }
    .link-item {
      display: flex; align-items: center; gap: 12px;
      min-height: 64px; padding: 10px 14px;
      border-radius: 18px; background: var(--white);
      box-shadow: 0 10px 22px rgba(7,14,32,0.18);
      transition: transform 160ms ease;
    }
    .link-item:hover { transform: translateY(-1px); }
    .link-icon {
      display: flex; align-items: center; justify-content: center;
      width: 40px; height: 40px; border-radius: 12px;
      flex-shrink: 0; color: #fff;
    }
    .link-icon svg {
      width: 20px; height: 20px; fill: none; stroke: currentColor;
      stroke-width: 2; stroke-linecap: round; stroke-linejoin: round;
    }
    .icon-whatsapp  { background: #25d366; }
    .icon-facebook  { background: #1877f2; }
    .icon-instagram { background: linear-gradient(135deg,#f58529,#dd2a7b 50%,#8134af); }
    .icon-linkedin  { background: #0a66c2; }
    .icon-email     { background: var(--navy-light); }
    .link-text { flex: 1; min-width: 0; }
    .link-text strong {
      display: block; font-family: system-ui, sans-serif;
      font-size: 13px; font-weight: 800; color: var(--ink);
    }
    .link-text span {
      display: block; margin-top: 1px; font-size: 10.5px;
      color: var(--muted-ink); overflow: hidden;
      text-overflow: ellipsis; white-space: nowrap;
    }
    .chevron { color: #c7cedb; flex-shrink: 0; }
    .chevron svg {
      width: 18px; height: 18px; fill: none; stroke: currentColor;
      stroke-width: 2; stroke-linecap: round; stroke-linejoin: round;
    }

    .catalog-header { margin: 3px 2px 14px; text-align: center; }
    .catalog-header h2 {
      margin: 0 0 4px; font-size: 16px; font-weight: 700;
      letter-spacing: 0.01em; color: #fff;
    }
    .catalog-header p {
      margin: 0 auto; max-width: 320px;
      color: var(--muted-on-dark); font-size: 11px;
    }

    .product-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }
    .product-card {
      display: flex; flex-direction: column; overflow: hidden;
      border-radius: 17px; border: 1px solid rgba(0,0,0,0.06);
      background: var(--white);
      box-shadow: 0 11px 24px rgba(7,14,32,0.18);
    }
    .product-image-wrap {
      position: relative; height: 128px;
      overflow: hidden; background: #1b3d54;
    }
    .product-image { width: 100%; height: 100%; display: block; object-fit: cover; }
    .product-badge {
      position: absolute; top: 9px; left: 9px;
      padding: 3px 7px; border-radius: 999px;
      background: rgba(255,255,255,.92); color: #1c2b34;
      font-family: system-ui, sans-serif;
      font-size: 9px; font-weight: 800; letter-spacing: .08em;
    }
    .product-body {
      display: flex; flex-direction: column;
      justify-content: space-between; flex: 1;
      gap: 9px; padding: 10px 11px 12px;
    }
    .product-title {
      color: var(--ink); font-family: system-ui, sans-serif;
      font-size: 11.5px; font-weight: 800;
      line-height: 1.28; letter-spacing: 0.01em;
    }
    .product-cta {
      display: flex; align-items: center; justify-content: center;
      gap: 6px; height: 34px; border-radius: var(--radius-pill);
      background: #25d366; color: #fff;
      font-family: system-ui, sans-serif;
      font-size: 10.5px; font-weight: 700; letter-spacing: 0.01em;
      box-shadow: 0 6px 14px rgba(37,211,102,0.35);
      transition: transform 160ms ease, filter 160ms ease;
    }
    .product-cta svg { width: 13px; height: 13px; flex-shrink: 0; }
    .product-cta:hover { transform: translateY(-1px); filter: brightness(1.06); }

    /* 12 warna gradasi kartu, dikyle otomatis */
    .pg-0  { background: linear-gradient(135deg,#e9eef7,#274b86 53%,#163064); }
    .pg-1  { background: linear-gradient(135deg,#ffcf70,#0e807d 50%,#072f35); }
    .pg-2  { background: linear-gradient(135deg,#90b8df,#184670 47%,#031927); }
    .pg-3  { background: linear-gradient(135deg,#ffd38a,#446c9a 44%,#0b2036); }
    .pg-4  { background: linear-gradient(135deg,#b4c9d9,#009b85 52%,#04332f); }
    .pg-5  { background: linear-gradient(135deg,#d8d1c8,#0a596e 50%,#122538); }
    .pg-6  { background: linear-gradient(135deg,#c8e6c9,#2e7d32 50%,#0a2e0d); }
    .pg-7  { background: linear-gradient(135deg,#ffe0b2,#e65100 50%,#4e1700); }
    .pg-8  { background: linear-gradient(135deg,#e1bee7,#6a1b9a 50%,#1e0030); }
    .pg-9  { background: linear-gradient(135deg,#b2dfdb,#00695c 50%,#00201c); }
    .pg-10 { background: linear-gradient(135deg,#f8bbd0,#c62828 50%,#450000); }
    .pg-11 { background: linear-gradient(135deg,#e8eaf6,#283593 50%,#060c2e); }

    .action-bar {
      display: flex; align-items: center; gap: 10px;
      padding: 14px 18px;
      background: rgba(5,11,26,0.35);
      border-top: 1px solid rgba(255,255,255,0.08);
    }
    .icon-btn {
      display: flex; align-items: center; justify-content: center;
      width: 42px; height: 42px; border-radius: 50%; border: 0;
      background: rgba(255,255,255,0.12); color: #fff; cursor: pointer;
    }
    .icon-btn svg {
      width: 19px; height: 19px; fill: none; stroke: currentColor;
      stroke-width: 2; stroke-linecap: round; stroke-linejoin: round;
    }
    .save-contact-btn {
      flex: 1; display: flex; align-items: center; justify-content: center;
      gap: 8px; height: 44px; border-radius: var(--radius-pill);
      background: #fff; color: var(--navy-deep); border: 0;
      font-weight: 800; font-size: 12.5px; cursor: pointer;
      font-family: system-ui, sans-serif;
      transition: transform 160ms ease;
    }
    .save-contact-btn:hover { transform: translateY(-1px); }
    .save-contact-btn svg {
      width: 17px; height: 17px; fill: none; stroke: currentColor;
      stroke-width: 2; stroke-linecap: round; stroke-linejoin: round;
    }

    @media (max-width: 370px) {
      body { padding: 18px 10px; }
      .page-shell { border-radius: 22px; }
      .card-content { padding: 22px 14px 18px; }
      .quick-actions { gap: 10px; }
    }
  </style>
</head>
<body>

  <main class="page-shell">
    <div class="card-content">

      <section class="profile" aria-label="Profil">
        <div class="avatar-wrap">
          <img class="avatar" id="profileAvatar" src="assets/profile.png" alt="Foto profil"
               onerror="this.src='data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 92 92%22><circle cx=%2246%22 cy=%2246%22 r=%2246%22 fill=%22%231f3f86%22/><text x=%2246%22 y=%2256%22 text-anchor=%22middle%22 font-size=%2240%22 fill=%22white%22>👤</text></svg>'" />
        </div>
        <h1 id="profileName">—</h1>
        <p id="profileSubtitle"></p>
      </section>

      <nav class="quick-actions" id="quickActions" aria-label="Aksi cepat"></nav>

      <nav class="tabs" aria-label="Pilihan konten">
        <button class="tab active" type="button" data-tab="links">Links</button>
        <button class="tab" type="button" data-tab="shop">Daftar Skema</button>
      </nav>

      <section class="tab-panel active" id="panel-links" data-panel="links">
        <div class="link-stack" id="linkStack"></div>
      </section>

      <section class="tab-panel" id="panel-shop" data-panel="shop">
        <div class="catalog-header">
          <h2 id="catalogTitle">Daftar Skema</h2>
          <p>Pilih program yang relevan, hubungi kami via WhatsApp.</p>
        </div>
        <div class="product-grid" id="productGrid"></div>
      </section>

    </div>

    <div class="action-bar">
      <button class="icon-btn" type="button" id="shareBtn" aria-label="Bagikan">
        <svg viewBox="0 0 24 24"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="m8.6 13.5 6.8 3.9M15.4 6.6 8.6 10.5"/></svg>
      </button>
      <button class="save-contact-btn" type="button" id="saveContactBtn">
        <svg viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M19 8v6M22 11h-6"/></svg>
        Simpan Kontak
      </button>
    </div>
  </main>

  <!-- ✅ Muat data dari assets/data.js — tidak perlu server -->
  <script src="assets/data.js"></script>

  <script>
    /* ── SVG icons ── */
    const IC = {
      phone:    `<svg viewBox="0 0 24 24"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.13.96.36 1.9.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.91.34 1.85.57 2.81.7A2 2 0 0 1 22 16.92Z"/></svg>`,
      sms:      `<svg viewBox="0 0 24 24"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5Z"/></svg>`,
      email:    `<svg viewBox="0 0 24 24"><path d="M4 6h16v12H4z"/><path d="m4 7 8 6 8-6"/></svg>`,
      wa:       `<svg viewBox="0 0 24 24"><path d="M20 11.5a8 8 0 0 1-11.8 7L4 20l1.5-4.1A8 8 0 1 1 20 11.5Z"/><path d="M9.2 8.4c.2-.5.4-.5.7-.5h.5c.2 0 .5.1.6.4.2.5.7 1.7.8 1.8.1.2.1.4 0 .6-.1.2-.2.3-.4.5-.2.2-.3.4-.1.7.2.3.7 1.2 1.5 1.9 1 .9 1.8 1.2 2.1 1.3.3.1.5.1.7-.1.2-.2.8-1 1-1.3.2-.3.4-.2.7-.1.3.1 1.7.8 2 1 .3.2.5.3.5.5 0 .2-.1 1.4-.7 1.9-.5.5-1.2.7-1.7.7-.4 0-1.1-.1-2-.4-3.5-1.4-5.8-4.6-6-4.8-.2-.3-1.4-1.9-1.4-3.5 0-1.7.8-2.5 1.1-2.8Z"/></svg>`,
      fb:       `<svg viewBox="0 0 24 24"><path d="M14 8h3V4h-3c-3 0-5 2-5 5v3H6v4h3v5h4v-5h3l1-4h-4V9c0-.6.4-1 1-1Z"/></svg>`,
      ig:       `<svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="5"/><circle cx="12" cy="12" r="3.5"/><path d="M17.5 6.8h.1"/></svg>`,
      li:       `<svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="M8 11v6M8 8v.1M12 17v-6M12 13.6c0-1.4 1-2.6 2.4-2.6S17 12.2 17 14v3"/></svg>`,
      chv:      `<svg viewBox="0 0 24 24"><path d="m9 6 6 6-6 6"/></svg>`,
      waFill:   `<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a10 10 0 0 0-8.6 15L2 22l5.2-1.4A10 10 0 1 0 12 2Zm5.4 14.2c-.2.6-1.3 1.2-1.8 1.3-.5.1-1 .1-1.7-.1-.4-.1-.9-.3-1.5-.6-2.7-1.2-4.5-3.9-4.6-4.1-.1-.2-1.1-1.5-1.1-2.8s.7-2 .9-2.2c.2-.2.5-.3.6-.3h.5c.2 0 .4 0 .5.4.2.5.7 1.7.7 1.8.1.1.1.3 0 .5-.1.2-.1.3-.3.4-.1.2-.3.3-.4.5-.1.1-.3.3-.1.6.2.3.7 1.2 1.6 1.9 1.1.9 2 1.2 2.3 1.4.3.1.5.1.6-.1.2-.2.7-.8.9-1.1.2-.3.4-.2.6-.1.2.1 1.5.7 1.8.9.3.1.4.2.5.3.1.2.1.7-.1 1.3Z"/></svg>`,
    };

    /* ── Normalize phone → 62xxx ── */
    function phone62(raw = '') {
      let p = String(raw).replace(/[\s\-+(). ]/g, '');
      if (p.startsWith('0')) p = '62' + p.slice(1);
      if (!p.startsWith('62')) p = '62' + p;
      return p;
    }

    /* ── URL guard: pastikan ada https:// ── */
    function toUrl(raw = '') {
      if (!raw) return '';
      return /^https?:\/\//i.test(raw) ? raw : 'https://' + raw;
    }

    /* ── Render semua konten dari DATA ── */
    function render(d) {
      const wa = phone62(d.phone || '');

      // Judul tab & halaman
      if (d.name) document.title = d.name + ' — Links';
      document.getElementById('profileName').textContent = d.name || '';
      document.getElementById('profileSubtitle').textContent =
        [d.title, d.organization].filter(Boolean).join(' · ');

      if (d.organization)
        document.getElementById('catalogTitle').textContent =
          'Daftar Skema — ' + d.organization;

      // Quick action buttons (telepon, sms, email, wa)
      document.getElementById('quickActions').innerHTML = [
        { href: `tel:+${wa}`,           icon: IC.phone, label: 'Telepon' },
        { href: `sms:+${wa}`,           icon: IC.sms,   label: 'Pesan' },
        { href: `mailto:${d.email||''}`,icon: IC.email,  label: 'Email' },
        { href: `https://wa.me/${wa}`,  icon: IC.wa,    label: 'WhatsApp', ext: true },
      ].map(b => `<a href="${b.href}" ${b.ext?'target="_blank" rel="noopener"':''} aria-label="${b.label}">${b.icon}</a>`).join('');

      // Link stack
      const links = [];
      if (d.phone)     links.push({ cls:'icon-whatsapp', icon:IC.wa, href:`https://wa.me/${wa}`, label:'WhatsApp',  sub:d.phone, ext:true });
      if (d.facebook)  links.push({ cls:'icon-facebook',  icon:IC.fb, href:toUrl(d.facebook),   label:'Facebook',  sub:'Ikuti kami di Facebook', ext:true });
      if (d.instagram) links.push({ cls:'icon-instagram', icon:IC.ig, href:toUrl(d.instagram),  label:'Instagram', sub:'Ikuti kami di Instagram', ext:true });
      if (d.linkedin)  links.push({ cls:'icon-linkedin',  icon:IC.li, href:toUrl(d.linkedin),   label:'LinkedIn',  sub:'Terhubung di LinkedIn', ext:true });
      if (d.email)     links.push({ cls:'icon-email',     icon:IC.email, href:`mailto:${d.email}`, label:'Email', sub:d.email });

      document.getElementById('linkStack').innerHTML = links.map(l => `
        <a class="link-item" href="${l.href}" ${l.ext?'target="_blank" rel="noopener"':''}>
          <span class="link-icon ${l.cls}">${l.icon}</span>
          <span class="link-text"><strong>${l.label}</strong><span>${l.sub}</span></span>
          <span class="chevron">${IC.chv}</span>
        </a>`).join('');

      // Product grid
      const badge = d.badge || 'BNSP';
      const schemes = Array.isArray(d.schemes) ? d.schemes : [];
      document.getElementById('productGrid').innerHTML = schemes.length
        ? schemes.map((name, i) => `
          <article class="product-card">
            <div class="product-image-wrap pg-${i % 12}">
              <img class="product-image" src="assets/skema-${i+1}.png" alt="${name}" onerror="this.remove()" />
              <span class="product-badge">${badge}</span>
            </div>
            <div class="product-body">
              <span class="product-title">${name}</span>
              <a class="product-cta" href="https://wa.me/${wa}?text=${encodeURIComponent('Hai, saya tertarik dengan '+name)}" target="_blank" rel="noopener">
                ${IC.waFill} Investasi Sekarang
              </a>
            </div>
          </article>`).join('')
        : `<p style="color:var(--muted-on-dark);text-align:center;font-size:12px;grid-column:1/-1;padding:20px 0">
             Belum ada skema. Tambahkan di <code>assets/data.js</code>
           </p>`;

      // vCard
      document.getElementById('saveContactBtn').onclick = () => {
        const vc = [
          'BEGIN:VCARD','VERSION:3.0',
          `FN:${d.name||''}`,
          `TITLE:${d.title||''}`,
          `ORG:${d.organization||''}`,
          `TEL;TYPE=CELL:+${wa}`,
          `EMAIL:${d.email||''}`,
          d.instagram ? `URL;TYPE=Instagram:${toUrl(d.instagram)}` : '',
          d.facebook  ? `URL;TYPE=Facebook:${toUrl(d.facebook)}`   : '',
          d.linkedin  ? `URL;TYPE=LinkedIn:${toUrl(d.linkedin)}`   : '',
          'END:VCARD',
        ].filter(Boolean).join('\r\n');
        const a = Object.assign(document.createElement('a'), {
          href: URL.createObjectURL(new Blob([vc], {type:'text/vcard'})),
          download: `${(d.name||'contact').replace(/\s+/g,'-')}.vcf`,
        });
        document.body.appendChild(a); a.click();
        document.body.removeChild(a);
      };
    }

    /* ── Tabs ── */
    document.querySelectorAll('[data-tab]').forEach(t =>
      t.addEventListener('click', () => {
        document.querySelectorAll('[data-tab]').forEach(x => x.classList.toggle('active', x===t));
        document.querySelectorAll('[data-panel]').forEach(p =>
          p.classList.toggle('active', p.dataset.panel === t.dataset.tab));
      })
    );

    /* ── Share ── */
    document.getElementById('shareBtn').addEventListener('click', async () => {
      try {
        navigator.share
          ? await navigator.share({title: document.title, url: location.href})
          : await navigator.clipboard.writeText(location.href);
      } catch {}
    });

    /* ── Jalankan render ── */
    if (typeof DATA !== 'undefined') {
      render(DATA);
    } else {
      document.getElementById('linkStack').innerHTML =
        `<p style="color:#f87171;text-align:center;font-size:12px;padding:20px 0">
           ⚠️ File <code>assets/data.js</code> tidak ditemukan.<br>
           Pastikan file ada di folder <strong>assets/</strong>.
         </p>`;
    }
  </script>
</body>
</html>
